name: Static validation

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile app.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("templates/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline dashboard script found")
          Path("/tmp/dashboard-check.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/dashboard-check.js
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 platform and firmware libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "DHT sensor library" "Adafruit Unified Sensor" "ArduinoJson"
      - name: Compile optimized ESP32 firmware
        run: |
          mkdir -p /tmp/Smart_Classroom_Fan_Optimized
          cp firmware/Smart_Classroom_Fan_Optimized.ino /tmp/Smart_Classroom_Fan_Optimized/Smart_Classroom_Fan_Optimized.ino
          cp firmware/secrets.example.h /tmp/Smart_Classroom_Fan_Optimized/secrets.h
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all /tmp/Smart_Classroom_Fan_Optimized
