<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | Smart Classroom Fan</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f2f5fa;color:#17243a;font:14px Inter,system-ui,Segoe UI,Arial,sans-serif}.card{width:min(100%,390px);background:#fff;border:1px solid #e3e9f2;border-radius:18px;padding:30px;box-shadow:0 18px 55px #1e3a5f12}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#316fe8}.icon{width:48px;height:48px;border-radius:14px;background:#edf3ff;display:grid;place-items:center;font-size:25px;margin-bottom:20px}h1{font-size:23px;margin:8px 0}.muted{color:#718096;font-size:12px;line-height:1.6}.field{margin-top:17px}label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #dce4ef;border-radius:9px;font:inherit;outline-color:#316fe8}button{width:100%;margin-top:22px;border:0;border-radius:9px;padding:12px;background:#316fe8;color:white;font-weight:800;cursor:pointer}.error{margin-top:14px;padding:10px;border-radius:8px;background:#fff0f0;color:#b53c3c;font-size:12px}
</style>
</head>
<body>
<main class="card">
  <div class="icon">🏫</div>
  <div class="eyebrow">CLOUD IOT MONITORING</div>
  <h1>Smart Classroom Fan</h1>
  <p class="muted">Masuk ke dashboard untuk memantau sensor dan mengendalikan kipas Kelas A serta Kelas B.</p>
  <form method="post" action="/login">
    <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button type="submit">Masuk ke Dashboard</button>
  </form>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
</main>
</body>
</html>
